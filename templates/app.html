<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المشتريات — لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    direction: rtl;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #1a1a2e;
    color: #e2e8f0;
}

/* ===== صفحة الدخول ===== */
#loginPage {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 100vh;
    background: #1a1a2e;
}

.login-card {
    background: #16213e;
    padding: 40px 30px;
    border-radius: 12px;
    width: 90%;
    max-width: 380px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    text-align: center;
    color: #e2e8f0;
}

.login-card h2 { margin-bottom: 8px; font-size: 22px; }
.login-card p { margin-bottom: 24px; color: #94a3b8; font-size: 13px; }

.form-label {
    display: block;
    text-align: right;
    margin-bottom: 4px;
    font-size: 13px;
    color: #94a3b8;
}

.form-input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: #0f172a;
    color: #e2e8f0;
    font-size: 14px;
    box-sizing: border-box;
    text-align: right;
}

.form-input:focus {
    outline: none;
    border-color: #3b82f6;
}

/* ===== التطبيق الرئيسي ===== */
#mainApp {
    display: flex;
    width: 100%;
    min-height: 100vh;
    flex-direction: row-reverse;
}

/* ===== الشريط الجانبي ===== */
.sidebar {
    width: 240px;
    min-width: 240px;
    height: 100vh;
    background: #0f172a;
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    overflow-y: auto;
    border-left: 1px solid #1e293b;
}

.sidebar-brand {
    padding: 20px 16px;
    border-bottom: 1px solid #1e293b;
    text-align: center;
}

.sidebar-brand h2 { font-size: 18px; margin: 0; }
.sidebar-brand p { font-size: 11px; color: #64748b; margin: 4px 0 0; }

.sidebar-menu {
    flex: 1;
    padding: 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.menu-label {
    font-size: 10px;
    color: #475569;
    padding: 8px 12px 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: #94a3b8;
    font-size: 13px;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    text-align: right;
    transition: background 0.2s;
}

.menu-item:hover { background: #1e293b; color: #e2e8f0; }
.menu-item.on { background: #1e293b; color: #3b82f6; }

.mi-icon { font-size: 16px; }
.mi-text { font-size: 13px; }

/* ===== منطقة المحتوى ===== */
.main-area {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: #1a1a2e;
}

.top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: #16213e;
    border-bottom: 1px solid #1e293b;
    position: sticky;
    top: 0;
    z-index: 10;
}

.page-title { font-size: 16px; margin: 0; }

.top-bar-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

.sync-btn {
    padding: 6px 14px;
    border: 1px solid #334155;
    border-radius: 6px;
    background: #0f172a;
    color: #94a3b8;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
}

.sync-btn:hover { border-color: #3b82f6; color: #3b82f6; }

/* ===== المحتوى ===== */
.page-content {
    flex: 1;
    padding: 20px 24px;
    overflow-y: auto;
}

.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
}

.stat-mini {
    background: #16213e;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
}

.sm-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}

.sm-icon { font-size: 18px; }
.sm-val { font-size: 20px; font-weight: 700; }
.sm-lbl { font-size: 11px; color: #64748b; margin-top: 4px; }

/* ألوان الإحصائيات */
.c1 { border-top: 3px solid #3b82f6; }
.c2 { border-top: 3px solid #f59e0b; }
.c3 { border-top: 3px solid #10b981; }
.c4 { border-top: 3px solid #ef4444; }
.c5 { border-top: 3px solid #8b5cf6; }
.c6 { border-top: 3px solid #ec4899; }
.c7 { border-top: 3px solid #06b6d4; }
.c8 { border-top: 3px solid #f97316; }

/* ===== الصفحات ===== */
.page { display: none; }
.page.on { display: block; }

/* ===== الفوتر ===== */
.sidebar-footer {
    padding: 12px;
    border-top: 1px solid #1e293b;
}

.user-info {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    margin-bottom: 8px;
}

.user-avatar {
    width: 36px;
    height: 36px;
    background: #1e293b;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.user-name { font-size: 13px; font-weight: 600; }
.user-role { font-size: 11px; color: #64748b; }

.logout-btn {
    width: 100%;
    padding: 8px;
    border: 1px solid #334155;
    border-radius: 8px;
    background: transparent;
    color: #ef4444;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
}

.logout-btn:hover { background: #ef4444; color: white; }

/* ===== التوست ===== */
.toast-container {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* ===== الأزرار ===== */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
}

.btn-primary {
    background: #3b82f6;
    color: white;
}

.btn-primary:hover { background: #2563eb; }

/* ===== الجداول ===== */
table {
    width: 100%;
    border-collapse: collapse;
    background: #16213e;
    border-radius: 10px;
    overflow: hidden;
}

th {
    background: #0f172a;
    padding: 10px 12px;
    font-size: 12px;
    color: #94a3b8;
    text-align: right;
    border-bottom: 1px solid #1e293b;
}

td {
    padding: 10px 12px;
    font-size: 13px;
    border-bottom: 1px solid #1e293b;
}

tr:hover { background: #1e293b; }

/* ===== متجاوب ===== */
@media (max-width: 768px) {
    .sidebar {
        width: 60px;
        min-width: 60px;
    }
    .mi-text, .sidebar-brand p, .user-name, .user-role,
    .menu-label, .logout-btn span { display: none; }
    .sidebar-brand h2 { font-size: 14px; }
    .page-content { padding: 12px; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
}
    </style>
</head>
<body>
    <div class="toast-container" id="toasts"></div>

    <!-- ===== صفحة تسجيل الدخول ===== -->
    <div id="loginPage" class="login-wrapper">
        <div class="login-card">
            <h2>🖥️ لوحة التحكم</h2>
            <p>بستان العجوة — Bustan Alajwa</p>
            <label class="form-label">اسم المستخدم</label>
            <input class="form-input" id="lUser" placeholder="admin">
            <label class="form-label">كلمة المرور</label>
            <input class="form-input" id="lPass" type="password" placeholder="••••••">
            <button class="btn btn-primary" onclick="doLogin()" style="width:100%;justify-content:center;padding:10px;font-size:14px">🔓 دخول</button>
        </div>
    </div>

    <!-- ===== التطبيق الرئيسي ===== -->
    <div id="mainApp" style="display:none">
        <aside class="sidebar">
            <div class="sidebar-brand"><h2>🌿 بستان العجوة</h2><p>نظام إدارة المشتريات v7.1</p></div>
            <nav class="sidebar-menu">
                <div class="menu-label">القائمة الرئيسية</div>
                <button class="menu-item on" id="menuReps" onclick="goTo('reps',this)"><span class="mi-icon">👥</span><span class="mi-text">المناديب</span></button>
                <button class="menu-item" id="menuAdvs" onclick="goTo('advs',this)"><span class="mi-icon">💰</span><span class="mi-text">العهد</span></button>
                <button class="menu-item" id="menuInvs" onclick="goTo('invs',this)"><span class="mi-icon">🧾</span><span class="mi-text">الفواتير</span></button>
                <button class="menu-item" id="menuExps" onclick="goTo('exps',this)"><span class="mi-icon">📄</span><span class="mi-text">مصروفات</span></button>
                <button class="menu-item" id="menuTax" onclick="goTo('tax',this)"><span class="mi-icon">🏛️</span><span class="mi-text">الضريبة</span></button>
                <div class="menu-label" style="margin-top:6px">الإدارة</div>
                <button class="menu-item" id="menuSuppliers" onclick="goTo('suppliers',this)"><span class="mi-icon">🏭</span><span class="mi-text">الموردين</span></button>
                <button class="menu-item" id="menuCompanies" onclick="goTo('companies',this)"><span class="mi-icon">🏢</span><span class="mi-text">الشركات</span></button>
                <button class="menu-item" id="menuUsers" onclick="goTo('users',this)"><span class="mi-icon">👤</span><span class="mi-text">المستخدمين</span></button>
                <button class="menu-item" id="menuShare" onclick="goTo('share',this)"><span class="mi-icon">🔗</span><span class="mi-text">روابط</span></button>
                <button class="menu-item" id="menuBackup" onclick="goTo('backup',this)"><span class="mi-icon">💾</span><span class="mi-text">نسخ احتياطي</span></button>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info"><div class="user-avatar">👤</div><div><div class="user-name" id="userName">المدير</div><div class="user-role" id="userRole">admin</div></div></div>
                <button class="logout-btn" onclick="doLogout()">🚪 تسجيل الخروج</button>
            </div>
        </aside>

        <div class="main-area">
            <header class="top-bar">
                <div class="top-bar-right"><h1 class="page-title" id="pageTitle">👥 المناديب</h1></div>
                <div class="top-bar-left">
                    <button class="sync-btn" id="pullBtn" onclick="pullFromCloud()">⬇️ سحب</button>
                    <button class="sync-btn" id="pushBtn" onclick="pushToCloud()">⬆️ رفع</button>
                    <span id="syncStatus" style="font-size:10px;color:#94a3b8"></span>
                </div>
            </header>

            <div class="page-content">
                <div class="stats-row" id="statsRow">
                    <div class="stat-mini c1"><div class="sm-row"><span class="sm-icon">👥</span><span class="sm-val" id="xReps">0</span></div><div class="sm-lbl">المناديب</div></div>
                    <div class="stat-mini c2"><div class="sm-row"><span class="sm-icon">💰</span><span class="sm-val" id="xAdvs">0</span></div><div class="sm-lbl">العهد</div></div>
                    <div class="stat-mini c3"><div class="sm-row"><span class="sm-icon">🧾</span><span class="sm-val" id="xInvs">0</span></div><div class="sm-lbl">الفواتير</div></div>
                    <div class="stat-mini c4"><div class="sm-row"><span class="sm-icon">📤</span><span class="sm-val" id="xExp">0</span></div><div class="sm-lbl">مصروفات</div></div>
                    <div class="stat-mini c5"><div class="sm-row"><span class="sm-icon">✅</span><span class="sm-val" id="xSettled">0</span></div><div class="sm-lbl">مسواه</div></div>
                    <div class="stat-mini c6"><div class="sm-row"><span class="sm-icon">📂</span><span class="sm-val" id="xOpen">0</span></div><div class="sm-lbl">مفتوحة</div></div>
                    <div class="stat-mini c7"><div class="sm-row"><span class="sm-icon">🏛️</span><span class="sm-val" id="xTax">0</span></div><div class="sm-lbl">ضريبية</div></div>
                    <div class="stat-mini c8"><div class="sm-row"><span class="sm-icon">💰</span><span class="sm-val" id="xTotalInv">0</span></div><div class="sm-lbl">إجمالي</div></div>
                </div>

                <div id="p-reps" class="page on"></div>
                <div id="p-advs" class="page"></div>
                <div id="p-invs" class="page"></div>
                <div id="p-exps" class="page"></div>
                <div id="p-tax" class="page"></div>
                <div id="p-suppliers" class="page"></div>
                <div id="p-companies" class="page"></div>
                <div id="p-users" class="page"></div>
                <div id="p-share" class="page"></div>
                <div id="p-backup" class="page"></div>
            </div>
        </div>
    </div>

    <script src="/static/gas-compat.js"></script>
    
    <script>
function addslashes(str){
    if(str===null||str===undefined)return '';
    return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\0/g,'\\0');
}
    var CSOPTS = [
        {g:'🌾 المزارع',v:['مزرعة عرعر','مزرعة الاكحل','مزرعة الاكحل شراكة','مزرعة الابل','مزرعة الغنم','مزرعة أبو طارق','مزرعة أبو عزام ضعا','مزرعة الاكحل الاستثمارية','مزرعة شجوى الشريف','مزرعة السليلة','مزرعة القفيف نخل','مزرعة القفيف خضار','مزرعة البحرة','مزرعة شجوى ابوبندر ابوفهد','مزرعة الكتيفة','مزرعة الاكحل عماد اللهيبي','مزرعة الثنيان']},
        {g:'🏠 خاص',v:['أبو عزام خاص','أبو عامر الغنم - خاص','الديرة ابوبندر - خاص','الديرة أبو فهد - خاص','ابو عامر خاص','ابو عبدلله خاص']},
        {g:'🏢 المرافق',v:['سكن الععمال','معمل البستان','سكن البستان','بستان العجوة','المحمية','المكتب','الصيانة','البوابة','المنتزه']},
        {g:'🛒 الأنشطة التجارية',v:['خردوات كتابة','خردوات محل','خردوات العاب','كشك البليله','كشك شاي الجمر','كشك البطاطس','الكوفي','المطعم','المعرض','المعارض والمؤتمرات','المستودع','الايسكريم','الألعاب']},
        {g:'📋 أخرى',v:['أخرى']}
    ];
    var DIRS = ['مصاريف عمومية','ضيافة','خصم مسموح به','مسموحات المبيعات','مصروف فواتي الكهرباء','مصروف فواتير المياة والوايتات','مصروف الهاتف والانترنت','رسوم التأمين الطبي','رواتب الإدارة','رسوم الجوازات','رسوم حكومية','مصروفات الزكاة والدخل','ضريبة القيمة المضافة'];
    var D = {reps:[], advances:[], purchases:[], expenses:[], users:[], advRequests:[], suppliers:[], companies:[]};
    var USER = null, MANUAL_ENTRY_ACTIVE = false, TAX_TAB = 'invoices';
    var PAGE_TITLES = {
        reps:'👥 المناديب', advs:'💰 العهد', invs:'🧾 الفواتير', exps:'📄 مصروفات',
        tax:'🏛️ الضريبة', suppliers:'🏭 الموردين', companies:'🏢 الشركات',
        users:'👤 المستخدمين', share:'🔗 روابط', backup:'💾 نسخ احتياطي'
    };

    // ============================================================
    // ===== دوال مساعدة =====
    // ============================================================
    function $(id){ return document.getElementById(id); }
    function f(n){ return Number(n||0).toLocaleString('en', {minimumFractionDigits:2, maximumFractionDigits:2}); }
    function fd(d){ if(!d) return '-'; var s = String(d).trim().split('T')[0]; var p = s.split('-'); if(p.length===3) return p[2]+'/'+p[1]+'/'+p[0].slice(2); return s; }
    function tst(m,t){ t=t||'inf'; var ic={ok:'✓', er:'✗', inf:'ℹ'}; var e = document.createElement('div'); e.className='toast '+t; e.innerHTML='<b>'+ic[t]+'</b> <span>'+m+'</span>'; $('toasts').appendChild(e); setTimeout(function(){ if(e.parentNode) e.remove(); }, 3000); }
    function addslashes(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'"'); }
    function nextId(arr){ var mx=0; arr.forEach(function(x){ var n=Number(x.id); if(n>0 && n<99999999 && n>mx) mx=n; }); return mx+1; }
    function calcTaxFor(amt,type){ if(type==='فاتورة ضريبية'){ var t = amt/1.15; return {tax:(amt-t).toFixed(2), taxable:t.toFixed(2)}; } return {tax:'0.00', taxable:'0.00'}; }
    function buildCCOpts(sel){ var h=''; CSOPTS.forEach(function(g){ h+='<optgroup label="'+g.g+'">'; g.v.forEach(function(c){ h+='<option'+(sel&&sel===c?' selected':'')+'>'+c+'</option>'; }); h+='</optgroup>'; }); return h; }
    function togCC(sel,oid){ var d = document.getElementById(oid+'Div'); if(d) d.style.display = sel.value==='أخرى'?'block':'none'; }
    function getCCVal(sid,oid){ var s=$(sid); if(!s) return ''; return s.value==='أخرى'? ($(oid)? $(oid).value||'أخرى' : 'أخرى') : s.value; }
    function buildSupplierOpts(sel){ var h='<option value="">-- اختر --</option>'; D.suppliers.forEach(function(s){ if(s.active!==false) h+='<option value="'+s.id+'"'+(sel&&String(sel)===String(s.id)?' selected':'')+'>'+s.name+(s.taxNo?' ('+s.taxNo+')':'')+'</option>'; }); return h; }
    function buildCompanyOpts(sel){ var h='<option value="">-- اختر --</option>'; D.companies.forEach(function(c){ if(c.active!==false) h+='<option value="'+c.id+'"'+(sel&&String(sel)===String(c.id)?' selected':'')+'>'+c.name+(c.taxNo?' ('+c.taxNo+')':'')+'</option>'; }); return h; }
    function getSupplierById(id){ var r=null; D.suppliers.forEach(function(s){ if(String(s.id)===String(id)) r=s; }); return r; }
    function getCompanyById(id){ var r=null; D.companies.forEach(function(c){ if(String(c.id)===String(id)) r=c; }); return r; }
    function findSupplierByTaxNo(taxNo){ if(!taxNo) return null; var tn=String(taxNo).trim().toLowerCase(); var found=null; D.suppliers.forEach(function(s){ if(s.taxNo && String(s.taxNo).trim().toLowerCase()===tn) found=s; }); return found; }
    function sortByDesc(arr){ return arr.slice().sort(function(a,b){ return Number(b.id||0)-Number(a.id||0); }); }
    function buildDirOpts(sel){ var h='<option value="">-- اختر --</option>'; DIRS.forEach(function(d){ h+='<option'+(sel&&sel===d?' selected':'')+'>'+d+'</option>'; }); return h; }
    function getSupDisplay(p){ if(p.vendorName) return p.vendorName; if(p.supplierName){ var s=getSupplierById(p.supplierName); if(s) return s.name; } return '-'; }
    function getRepName(repId){ var rn='-'; D.reps.forEach(function(r){ if(Number(r.id)===Number(repId)) rn=r.name; }); return rn; }
    function getAdvRepName(advId){ var rn='-'; D.advances.forEach(function(a){ if(Number(a.id)===Number(advId)){ D.reps.forEach(function(r){ if(Number(r.id)===Number(a.repId)) rn=r.name; }); } }); return rn; }
    function isAdmin(){ if(!USER) return false; var r=String(USER.role||'').toLowerCase().trim(); return r==='admin' || USER.username==='admin'; }
    function isAll(){ if(!USER) return false; return String(USER.role||'').toLowerCase().trim()==='all'; }
    function isTax(){ if(!USER) return false; return String(USER.role||'').toLowerCase().trim()==='tax'; }
    function canEdit(){ return isAdmin() || isAll(); }
    function canAccessTax(){ return isAdmin() || isTax(); }
    function canManageUsers(){ return isAdmin(); }

    // ============================================================
    // ===== التخزين المحلي =====
    // ============================================================
    function saveLocal(){ try { localStorage.setItem('bustanLocal', JSON.stringify(D)); } catch(e){} }
    function loadLocal(){ try { var s=localStorage.getItem('bustanLocal'); if(!s) return false; var d=JSON.parse(s); D.reps=d.reps||[]; D.advances=d.advances||[]; D.purchases=d.purchases||[]; D.expenses=d.expenses||[]; D.users=d.users||[]; D.advRequests=d.advRequests||[]; D.suppliers=d.suppliers||[]; D.companies=d.companies||[]; return true; } catch(e){ return false; } }

    // ============================================================
    // ===== الاتصال بالخادم =====
    // ============================================================
    function srv(fn){ var a=Array.prototype.slice.call(arguments,1); return new Promise(function(ok,no){ google.script.run.withSuccessHandler(function(res){ if(typeof res==='string'){ try{ res=JSON.parse(res); } catch(e){} } ok(res); }).withFailureHandler(function(e){ no(e); })[fn].apply(null,a); }); }

    function doLogin() {
    var username = document.getElementById('lUser').value.trim();
    var password = document.getElementById('lPass').value.trim();

    if (!username || !password) {
        showToast('أدخل اسم المستخدم وكلمة المرور', 'warn');
        return;
    }

    // مقارنة مع بيانات المستخدمين
    var found = D.users.find(function(u) {
        return u.username === username && u.password === password;
    });

    if (found) {
        USER = found;
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        document.getElementById('userName').textContent = found.name;
        document.getElementById('userRole').textContent = found.role;
        showToast('مرحباً ' + found.name, 'success');
        refreshStats();
        renderReps();
    } else {
        showToast('بيانات الدخول غير صحيحة', 'error');
    }
}

function copyLink(txt){
    if(navigator.clipboard){
        navigator.clipboard.writeText(txt).then(function(){tsto('تم النسخ ✓','ok')}).catch(function(){fallCopy(txt)});
    }else{fallCopy(txt)}
}
function fallCopy(txt){
    var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;left:-9999px';
    document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);
    tsto('تم النسخ ✓','ok');
}

    function goTo(pageId, btnEl){

    function updateStats(){
        var ar = 0; D.reps.forEach(function(r){ if(r.active===true || r.active==='true') ar++; });
        var expTotal = 0; D.expenses.forEach(function(x){ if(x.status==='approved') expTotal += Number(x.amount); });
        var settled = 0, open2 = 0; D.advances.forEach(function(a){ if(a.status==='settled') settled++; else open2++; });
        var taxInvs = 0; D.purchases.forEach(function(p){ if(p.invoiceType==='فاتورة ضريبية') taxInvs++; });
        var totalInvAmt = 0; D.purchases.forEach(function(p){ totalInvAmt += Number(p.amount); });
        var el; el=$('xReps'); if(el) el.textContent=ar; el=$('xAdvs'); if(el) el.textContent=D.advances.length;
        el=$('xInvs'); if(el) el.textContent=D.purchases.length; el=$('xExp'); if(el) el.textContent=f(expTotal);
        el=$('xSettled'); if(el) el.textContent=settled; el=$('xOpen'); if(el) el.textContent=open2;
        el=$('xTax'); if(el) el.textContent=taxInvs; el=$('xTotalInv'); if(el) el.textContent=f(totalInvAmt);
    }

    function editRep(id){ var rep=null; D.reps.forEach(function(r){ if(Number(r.id)===id) rep=r; }); if(!rep) return; var el=document.getElementById('p-reps'); if(!el) return; var isActive=rep.active===true || rep.active==='true'; var h='<div class="card"><div class="card-header"><h3>✏️ تعديل المندوب #'+id+'</h3><button class="btn btn-gray btn-sm" onclick="renderReps()">✕</button></div><div class="card-body-pad">'; h+='<div class="form-grid"><div class="form-group"><label class="form-label">الاسم</label><input class="form-input" id="eRName" value="'+addslashes(rep.name)+'"></div><div class="form-group"><label class="form-label">الهاتف</label><input class="form-input" id="eRPhone" value="'+(rep.phone||'')+'"></div></div>'; h+='<div class="form-grid"><div class="form-group"><label class="form-label">القسم</label><input class="form-input" id="eRDept" value="'+addslashes(rep.dept||'')+'"></div><div class="form-group"><label class="form-label">PIN</label><input class="form-input" id="eRPin" value="'+(rep.pin||'')+'" maxlength="4"></div></div>'; h+='<div class="form-grid"><div class="form-group"><label class="form-label">ملاحظات</label><input class="form-input" id="eRNotes" value="'+addslashes(rep.notes||'')+'"></div><div class="form-group"><label class="form-label">الحالة</label><select class="form-input" id="eRActive"><option value="true"'+(isActive?' selected':'')+'>نشط</option><option value="false"'+(!isActive?' selected':'')+'>معطل</option></select></div></div>'; h+='<button class="btn btn-primary" onclick="saveRep('+id+')" style="width:100%;justify-content:center;padding:10px">💾 حفظ</button></div></div>'; el.innerHTML=h; }

    function buildAdvRows(advs){ var h=''; var sorted=sortByDesc(advs); sorted.forEach(function(a){ var rn=getRepName(a.repId); var ts=0; D.purchases.forEach(function(p){ if(Number(p.advId)===Number(a.id)) ts+=Number(p.amount); }); D.expenses.forEach(function(x){ if(Number(x.advId)===Number(a.id) && x.status==='approved') ts+=Number(x.amount); }); var st=a.status==='open'?'<span class="badge badge-blue">مفتوحة</span>':a.status==='settled'?'<span class="badge badge-green">مسواة</span>':'<span class="badge badge-amber">بانتظار</span>'; var sd=a.status==='settled' && a.settleDate ? '<span style="color:#059669;font-weight:700">'+fd(a.settleDate)+'</span>' : '<span style="color:#94a3b8">—</span>'; h+='<tr><td style="color:#d97706;font-weight:700">#'+a.id+'</td><td>'+rn+'</td><td style="font-weight:700">'+f(a.amount)+'</td><td style="color:#ef4444;font-weight:700">'+f(ts)+'</td><td>'+fd(a.date)+'</td><td>'+(a.purpose||'-')+'</td><td>'+st+'</td><td>'+sd+'</td>'; h+='<td><button class="btn btn-blue btn-sm" onclick="editAdv('+a.id+')">✏️</button> <button class="btn btn-orange btn-sm" onclick="settleAdv('+a.id+')">✅</button> <button class="btn btn-red btn-sm" onclick="delAdv('+a.id+')">🗑️</button></td></tr>'; }); if(!sorted.length) h='<tr><td colspan="9" class="empty-state">لا توجد عهد</td></tr>'; return h; }

    function calcAdvFilterTotal(advs){ var t=0,s=0; advs.forEach(function(a){ t+=Number(a.amount); D.purchases.forEach(function(p){ if(Number(p.advId)===Number(a.id)) s+=Number(p.amount); }); D.expenses.forEach(function(x){ if(Number(x.advId)===Number(a.id) && x.status==='approved') s+=Number(x.amount); }); }); var el; el=$('advFilterTotal'); if(el) el.value=f(t); el=$('advFilterSpent'); if(el) el.value=f(s); el=$('advFilterRem'); if(el){ el.value=f(t-s); el.style.color=(t-s)>=0?'#059669':'#ef4444'; } }

        var doSave = function(){

                amount:Number($('ePAmt').value),
                taxableAmount:Number($('ePTaxable')?$('ePTaxable').value:0),
                taxAmount:Number($('ePTax')?$('ePTax').value:0),
                invoiceType:$('ePType').value,
                invoiceNo:$('ePNo').value,
                costCenter:getCCVal('ePCC','ePOther'),

                date:$('ePDate').value,
                notes:$('ePNotes').value,
                supplierName:supId,
                supplierTaxNo:taxNo,
                companyId:$('ePCompany')?$('ePCompany').value:'',
                vendorName:vendorName,
                direction:direction
            };
            srv('srvUpdatePurchase', id, updateData).then(function(r){
                if(r && r.success){
                    D.purchases.forEach(function(p){ if(Number(p.id)===id) Object.keys(updateData).forEach(function(k){ p[k] = updateData[k]; }); });

                    tst('تم التعديل','ok');
                } else { tst('فشل','er'); }
            }).catch(function(){ tst('خطأ','er'); });

    function calcManualTax(i){
        var a = Number($('mAmt'+i).value)||0, t = $('mType').value;
        var r = calcTaxFor(a, t);

    function saveManualBatch(){
        var advId = Number($('mAdv').value);
        var invType = $('mType').value;
        if(!advId){ alert('اختر العهدة'); return; }
        var items = [];
        for(var i=0; i<30; i++){
            var amt = Number($('mAmt'+i).value)||0;
            if(amt <= 0) continue;
            items.push({
                advId: advId,
                amount: amt,
                taxableAmount: Number($('mTxbl'+i).value)||0,
                taxAmount: Number($('mTax'+i).value)||0,
                invoiceType: invType,
                invoiceNo: $('mNo'+i).value,
                costCenter: $('mCC'+i).value,
                desc: $('mDesc'+i).value,
                date: $('mDate'+i).value,
                notes: ''
            });
        }
        if(!items.length){ alert('لا توجد بيانات'); return; }
        if(!confirm('حفظ '+items.length+' فاتورة؟')) return;
        tst('جاري حفظ '+items.length+' فاتورة...','inf');
        var done = 0;
        items.forEach(function(item, idx){
            srv('srvAddPurchase', item).then(function(r){
                if(r && r.success){
                    D.purchases.push(Object.assign({id:r.id}, item));
                    done++;
                }
                if(done + (items.length - done - 1) >= items.length || idx === items.length-1){
                    // 마지막 항목 처리 후
                }
                if(idx === items.length-1){
                    saveLocal(); updateStats(); renderInvs();
                    tst('تم حفظ '+done+' فاتورة','ok');
                    MANUAL_ENTRY_ACTIVE = false;
                }
            }).catch(function(){
                if(idx === items.length-1){
                    saveLocal(); updateStats(); renderInvs();
                    tst('تم حفظ '+done+' من '+items.length,'ok');
                    MANUAL_ENTRY_ACTIVE = false;
                }
            });
        });
    }

    function exportTaxExcel(){
        if(typeof XLSX === 'undefined'){ tst('مكتبة XLSX غير محملة','er'); return; }
        var taxInvs = D.purchases.filter(function(p){ return p.invoiceType === 'فاتورة ضريبية'; });
        var ws_data = [['#','المندوب','رقم الفاتورة','المورد','الرقم الضريبي','الشركة','الإجمالي','خاضع الضريبة','الضريبة','مركز التكلفة','التاريخ']];
        sortByDesc(taxInvs).forEach(function(p){
            var sup=p.supplierName?getSupplierById(p.supplierName):null;
            var comp=p.companyId?getCompanyById(p.companyId):null;
            ws_data.push([p.id, getAdvRepName(p.advId), p.invoiceNo||'', getSupDisplay(p), sup?sup.taxNo:'', comp?comp.name:'', Number(p.amount)||0, Number(p.taxableAmount)||0, Number(p.taxAmount)||0, p.costCenter||'', p.date||'']);
        });
        var ws = XLSX.utils.aoa_to_sheet(ws_data);
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'الفواتير الضريبية');
        XLSX.writeFile(wb, 'فواتير_ضريبية_' + new Date().toISOString().split('T')[0] + '.xlsx');
        tst('تم تصدير الفواتير الضريبية','ok');
    }

    // ===== رفع ملف JSON (مصحح — يدعم العربية) =====
    function uploadFile(){
    var fi=document.getElementById('fileInput');
    if(!fi||!fi.files||!fi.files.length){tsto('اختر ملف JSON','er');return}
    var file=fi.files[0];
    if(!file.name.endsWith('.json')){tsto('يجب أن يكون ملف JSON','er');return}
    if(!confirm('سيتم استبدال جميع البيانات الحالية. متأكد؟'))return;
    tsto('جاري القراءة...','inf');
    var reader=new FileReader();
    reader.onload=function(e){
        try{
            var content=e.target.result;
            JSON.parse(content);
            var base64=btoa(unescape(encodeURIComponent(content)));
            tsto('جاري الاستيراد...','inf');
            google.script.run
                .withSuccessHandler(function(res){
                    if(typeof res==='string'){try{res=JSON.parse(res)}catch(e){}}
                    if(res&&res.ok){
                        tsto('✅ '+res.msg,'ok');
                        loadData();
                    }else{
                        tsto('❌ '+(res&&res.err?res.err:'فشل'),'er');
                    }
                    fi.value='';
                })
                .withFailureHandler(function(err){
                    tsto('❌ خطأ: '+err.message,'er');
                    fi.value='';
                })
                .importFromUploadedFile(base64,file.name);
        }catch(err){
            tsto('❌ الملف غير صالح: '+err.message,'er');
            fi.value='';
        }
    };
    reader.readAsText(file,'UTF-8');
}
    function importFromDrive(){
        var fileId = $('driveFileId') ? $('driveFileId').value.trim() : '';
        if(!fileId){ alert('أدخل File ID'); return; }
        if(!confirm('استبدال جميع البيانات الحالية؟')) return;
        tst('جاري الاستيراد من Drive...','inf');
        srv('importFromDriveFile', fileId).then(function(r){
            if(r && r.ok){ tst('✅ '+r.msg,'ok'); loadData(); }
            else { tst('❌ '+(r && r.err ? r.err : 'فشل'),'er'); }
        }).catch(function(){ tst('خطأ في الاتصال','er'); });
    }

    function importFromSheet(){
        var sheetId = $('sheetImportId') ? $('sheetImportId').value.trim() : '';
        if(!sheetId){ alert('أدخل Sheet ID'); return; }
        if(!confirm('استبدال جميع البيانات من الشيت الآخر؟')) return;
        tst('جاري الاستيراد...','inf');
        srv('importFromSheet', sheetId).then(function(r){
            if(r && r.ok){ tst('✅ '+r.msg,'ok'); loadData(); }
            else { tst('❌ '+(r && r.err ? r.err : 'فشل'),'er'); }
        }).catch(function(){ tst('خطأ في الاتصال','er'); });
    }

    // ===== تصدير Excel شامل =====
    function exportAllExcel(){
        if(typeof XLSX === 'undefined'){ tst('مكتبة XLSX غير محملة','er'); return; }
        var wb = XLSX.utils.book_new();
        // ورقة المناديب
        var repsData = [['#','الاسم','الهاتف','القسم','PIN','الحالة']];
        D.reps.forEach(function(r){ repsData.push([r.id, r.name, r.phone||'', r.dept||'', r.pin||'', r.active?'نشط':'معطل']); });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(repsData), 'المناديب');
        // ورقة العهد
        var advsData = [['#','المندوب','المبلغ','التاريخ','الغرض','الحالة','تسوية']];
        D.advances.forEach(function(a){ advsData.push([a.id, getRepName(a.repId), Number(a.amount)||0, a.date||'', a.purpose||'', a.status||'', a.settleDate||'']); });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(advsData), 'العهد');
        // ورقة الفواتير
        var invsData = [['#','المندوب','رقم الفاتورة','المورد','الإجمالي','خاضع','الضريبة','النوع','البيان','مركز التكلفة','التوجيه','التاريخ','ملاحظات']];
        D.purchases.forEach(function(p){ invsData.push([p.id, getAdvRepName(p.advId), p.invoiceNo||'', getSupDisplay(p), Number(p.amount)||0, Number(p.taxableAmount)||0, Number(p.taxAmount)||0, p.invoiceType||'', p.desc||'', p.costCenter||'', p.direction||'', p.date||'', p.notes||'']); });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(invsData), 'الفواتير');
        // ورقة المصروفات
        var expsData = [['#','المندوب','المبلغ','البيان','التاريخ','مركز التكلفة','الحالة']];
        D.expenses.forEach(function(x){ expsData.push([x.id, getRepName(x.repId), Number(x.amount)||0, x.desc||'', x.date||'', x.costCenter||'', x.status||'']); });
        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(expsData), 'المصروفات');
        XLSX.writeFile(wb, 'بيانات_بستان_العجوة_' + new Date().toISOString().split('T')[0] + '.xlsx');
        tst('تم تصدير Excel الشامل','ok');
    }

    // ===== مسح جميع البيانات =====
    function confirmClearAll(){
        var msg = '⚠️ تحذير!\n\nهل أنت متأكد من مسح جميع البيانات؟\n\nسيتم مسح:\n';
        msg += '• '+D.reps.length+' مندوب\n';
        msg += '• '+D.advances.length+' عهدة\n';
        msg += '• '+D.purchases.length+' فاتورة\n';
        msg += '• '+D.expenses.length+' مصروف\n';
        msg += '• '+D.suppliers.length+' مورد\n';
        msg += '• '+D.companies.length+' شركة\n\n';
        msg += 'هذا الإجراء لا يمكن التراجع عنه!';
        if(!confirm(msg)) return;
        if(!confirm('تأكيد نهائي: مسح كل شيء؟')) return;
        // مسح محلي
        D = {reps:[], advances:[], purchases:[], expenses:[], users:D.users, advRequests:[], suppliers:[], companies:[]};
        saveLocal();
        // مسح على الخادم
        srv('srvSaveAll', {reps:[], advances:[], purchases:[], expenses:[], suppliers:[], companies:[]}).then(function(r){
            if(r && r.success){ updateStats(); renderAll(); tst('تم مسح جميع البيانات','ok'); }
            else { tst('تم المسح محلياً','inf'); updateStats(); renderAll(); }
        }).catch(function(){ tst('تم المسح محلياً','inf'); updateStats(); renderAll(); });
    }
